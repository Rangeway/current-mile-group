# HTTP (both domains) -> canonical HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name currentmile.com www.currentmile.com;
    return 301 https://currentmile.com$request_uri;
}

# Canonical: serve the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name currentmile.com;

    ssl_certificate /etc/letsencrypt/live/currentmile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/currentmile.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/current-mile-group;
    include snippets/rangeway-static.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}

# www -> canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.currentmile.com;

    ssl_certificate /etc/letsencrypt/live/currentmile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/currentmile.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://currentmile.com$request_uri;
}
